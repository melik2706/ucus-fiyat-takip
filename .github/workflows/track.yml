name: Uçuş fiyat takibi

# Zamanlanmış takip Oracle sunucusunda çalışır (deploy/ klasörü). Bu iş akışı sadece elle yedek çalıştırma içindir.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fiyatları kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Fiyat geçmişini kaydet
        if: always()
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "chore: fiyat kontrolü $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
